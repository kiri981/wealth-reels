name = "wc-hub"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Alle 5 Minuten: Kerzen holen, Papierhandel, (stündlich) Register, (täglich) GitHub-Export + Bericht
[triggers]
crons = ["*/5 * * * *"]

# Gleiche Datenbank wie der Welcome-Bot (Postausgang an Kevin läuft über dessen Tabelle "outbox")
[[d1_databases]]
binding = "DB"
database_name = "trading-hub"
database_id = "fa40e3b3-a557-4213-86ab-a36d30394586"

[vars]
# Gehandelte Symbole (Papierhandel): Gold, Silber, Bitcoin
SYMBOLS = "XAUUSD,XAGUSD,BTCUSD"
GH_REPO = "kiri981/wealth-reels"
# Region des MetaApi-Kontos (wie META_REGION beim Copy-Trader, z. B. "london" oder "new-york")
META_REGION = "london"

# Secrets (einmalig mit "npx.cmd wrangler secret put NAME" setzen):
#   META_TOKEN, META_ACCOUNT  – wie beim Copy-Trader (nur lesend genutzt)
#   (GH_TOKEN optional – nicht nötig: der nächtliche Forschungs-Agent holt die Daten selbst aus D1)
#   HUB_KEY   – frei gewähltes Passwort fürs Dashboard
#   COINALYZE_KEY – API-Schlüssel von coinalyze.net (Konto → API Key), für Funding/Open Interest/Liquidationen

# Workers AI: bewertet Nachrichten (kostenloses Tageskontingent)
[ai]
binding = "AI"

[observability]
enabled = true
